<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Toky Chat</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #020617; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      text-align: center;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 320px; }
    .mark {
      width: 88px; height: 88px; border-radius: 20px;
      background: linear-gradient(150deg, #2f66ff, #12a150);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 52px; font-weight: 800;
      box-shadow: 0 12px 40px rgba(47, 102, 255, 0.35);
    }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid rgba(226, 232, 240, 0.25); border-top-color: #e2e8f0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #offline { display: none; flex-direction: column; align-items: center; gap: 14px; }
    #offline.show { display: flex; }
    #loading.hide { display: none; }
    h1 { font-size: 17px; font-weight: 600; margin: 0; }
    p { font-size: 14px; line-height: 1.5; color: #94a3b8; margin: 0; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: linear-gradient(150deg, #2f66ff, #12a150); color: #fff;
      font-size: 15px; font-weight: 600; padding: 12px 28px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">T</div>
    <div id="loading"><div class="spinner"></div></div>
    <div id="offline">
      <h1>Can't reach Toky</h1>
      <p>Check your internet connection and try again.</p>
      <button id="retry" type="button">Retry</button>
    </div>
  </div>

  <script>
    // Boot the native shell into the live hosted app. Keep this loader in sync
    // with server.allowNavigation in capacitor.config.ts.
    var REMOTE = 'https://mobile-chat-mvp.vercel.app';
    var loading = document.getElementById('loading');
    var offline = document.getElementById('offline');

    function showOffline() {
      loading.classList.add('hide');
      offline.classList.add('show');
    }

    function boot() {
      offline.classList.remove('show');
      loading.classList.remove('hide');
      // A quick reachability probe so we can show a friendly offline screen
      // instead of a dead white webview when the network is down.
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; showOffline(); } }, 6000);
      fetch(REMOTE + '/manifest.webmanifest', { method: 'HEAD', cache: 'no-store' })
        .then(function () {
          if (done) return; done = true; clearTimeout(timer);
          window.location.replace(REMOTE + '/chats');
        })
        .catch(function () {
          if (done) return; done = true; clearTimeout(timer); showOffline();
        });
    }

    document.getElementById('retry').addEventListener('click', boot);
    boot();
  </script>
</body>
</html>
